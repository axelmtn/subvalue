name: Validate
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npx playwright install chromium
        if: runner.os != 'Windows'
      - run: npm run test:e2e
      - run: npm pack --workspace @subvalue/cli --ignore-scripts --pack-destination artifacts
      - name: Private tester package
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: subvalue-cli-${{ github.sha }}
          path: artifacts/subvalue-cli-*.tgz
          if-no-files-found: error
          retention-days: 14
      - name: Test packaged CLI outside checkout
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          mkdir -p subvalue-package-smoke
          cd subvalue-package-smoke
          SUBVALUE_PACKAGE=("$GITHUB_WORKSPACE"/artifacts/subvalue-cli-*.tgz)
          test "${#SUBVALUE_PACKAGE[@]}" -eq 1
          npx --offline --yes --package "${SUBVALUE_PACKAGE[0]}" subvalue --dry-run
          npx --offline --yes --package "${SUBVALUE_PACKAGE[0]}" subvalue --scan-only --data-dir ./cache --verbose
          npx --offline --yes --package "${SUBVALUE_PACKAGE[0]}" subvalue --scan-only --data-dir ./cache --verbose
